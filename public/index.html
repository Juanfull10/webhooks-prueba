<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Web sockets - <small>status</small></h1>

    <form action="">
        <input type="text" placeholder="enviar mensaje">
        <button>Enviar</button>
    </form>

    <ul id="messages">

    </ul>

    <script>
      
        let socket= null;


        const form=document.querySelector('form');
        const input=document.querySelector('input')
        const messageElement=document.querySelector('#messages');
        const statusElemnt=document.querySelector('small');

        function sendMessage(message){

                    socket && socket.send(message);

         }

        function renderMessage(mensaje){
                    const li= document.createElement('li');
                    li.innerHTML=mensaje;
                    messageElement.prepend(li);
        };

        form.addEventListener('submit',(event)=>{
                    event.preventDefault();
                    const message=input.value;
                    sendMessage(message);
                    input.value=null;
        });
        
          function connectedToSocket(){

                socket= new WebSocket('ws://localhost:3000');     

                socket.onopen=(event)=>{
                    statusElemnt.innerHTML='Online';
                }

                socket.onclose=(event)=>{
                    statusElemnt.innerHTML='offline';
                    setTimeout(()=>{
                        connectedToSocket()
                    },1500);
                }

                socket.onmessage=(event)=>{
                    const {payload}=JSON.parse(event.data);
                renderMessage(payload);
                }

          }

          connectedToSocket();
    
    </script>
</body>
</html>
